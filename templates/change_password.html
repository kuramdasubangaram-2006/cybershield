{% extends "dashboard_base.html" %}
{% set page_title = "Change password" %}
{% block content %}
  <section class="welcome-row">
    <div><p class="eyebrow">ACCOUNT SECURITY</p><h2>Change your password</h2><p>Use this page to replace a temporary password or update your current one.</p></div>
  </section>

  <section class="content-panel password-change-panel">
    <div class="panel-heading"><div><h3>Update password</h3><p>Your new password must be at least 12 characters.</p></div></div>
    <form class="password-change-form" method="post" action="{{ url_for('change_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div><label class="form-label" for="current_password">Current password</label><input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required></div>
      <div><label class="form-label" for="new_password">New password</label><input class="form-control" id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required></div>
      <div><label class="form-label" for="password_confirmation">Confirm new password</label><input class="form-control" id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="12" required></div>
      <button class="btn sign-in-button password-change-button" type="submit">Update password <span aria-hidden="true">→</span></button>
    </form>
  </section>
{% endblock %}
